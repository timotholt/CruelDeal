<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <filter id="noise" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="2.8 1.2" numOctaves="2" seed="77"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="0 0 1 1"/>
      <feFuncG type="discrete" tableValues="0 0 1 1"/>
      <feFuncB type="discrete" tableValues="0 0 1 1"/>
    </feComponentTransfer>
  </filter>
  <rect width="256" height="256" fill="#000"/>
  <rect width="256" height="256" filter="url(#noise)"/>
</svg>
