<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stainless Card v3</title>
  <style>
    :root {
      --card-w: min(82vw, 470px, calc((100vh - 72px) * 5 / 7.45));
      --radius: 22px;
      --cut: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 28%, rgb(62 74 90), transparent 34%),
        linear-gradient(145deg, #05070b, #151d28 52%, #030509);
      font-family: "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
    }

    .stage {
      perspective: 1400px;
      padding: 28px;
    }

    .card {
      position: relative;
      width: var(--card-w);
      aspect-ratio: 5 / 7.45;
      isolation: isolate;
      border-radius: var(--radius);
      transform: rotateX(3deg) rotateY(-4deg);
      background:
        linear-gradient(115deg, transparent 0 22%, rgb(255 255 255 / 0.38) 23%, transparent 31% 68%, rgb(255 255 255 / 0.22) 70%, transparent 78%),
        linear-gradient(145deg, #f6f8fb 0%, #b8c0cb 32%, #f5f7fa 48%, #8f9aa8 73%, #e6ebf1 100%);
      box-shadow:
        0 36px 80px rgb(0 0 0 / 0.68),
        0 0 26px rgb(185 209 240 / 0.28),
        inset 0 1px 0 rgb(255 255 255 / 0.92),
        inset 0 -1px 0 rgb(29 37 47 / 0.34),
        inset 0 0 0 1px rgb(255 255 255 / 0.62);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: calc(var(--radius) - 8px);
      pointer-events: none;
      border: 1px solid rgb(255 255 255 / 0.44);
      box-shadow:
        inset 0 1px 0 rgb(255 255 255 / 0.5),
        inset 0 -1px 0 rgb(32 42 56 / 0.22);
    }

    .art-well {
      position: absolute;
      inset: 26px;
      padding: 6px;
      overflow: hidden;
      clip-path: polygon(
        0 0,
        100% 0,
        100% calc(100% - var(--cut)),
        calc(100% - var(--cut)) 100%,
        var(--cut) 100%,
        0 calc(100% - var(--cut))
      );
      background:
        linear-gradient(180deg, rgb(255 255 255 / 0.78), rgb(175 187 202 / 0.48) 52%, rgb(238 242 247 / 0.62)),
        linear-gradient(145deg, rgb(255 255 255 / 0.62), rgb(68 78 92 / 0.24));
      box-shadow:
        inset 0 1px 0 rgb(255 255 255 / 0.8),
        inset 1px 0 0 rgb(255 255 255 / 0.42),
        inset 0 -1px 0 rgb(255 255 255 / 0.62),
        inset 0 -7px 12px rgb(29 38 51 / 0.22),
        inset -10px 0 16px rgb(0 0 0 / 0.18);
    }

    .art {
      width: 100%;
      height: 100%;
      clip-path: inherit;
      background: url("card-art.png") center / cover no-repeat;
      box-shadow:
        inset 0 0 0 1px rgb(255 255 255 / 0.16),
        inset 0 12px 18px rgb(255 255 255 / 0.08),
        inset 0 -14px 22px rgb(0 0 0 / 0.34),
        inset -16px 0 24px rgb(0 0 0 / 0.28),
        inset 16px 0 24px rgb(0 0 0 / 0.18);
    }

    @media (max-width: 520px) {
      :root {
        --card-w: min(92vw, 390px, calc((100vh - 44px) * 5 / 7.45));
      }

      .stage {
        padding: 18px;
      }

      .art-well {
        inset: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Stainless steel card prototype">
    <article class="card">
      <div class="art-well">
        <div class="art" aria-hidden="true"></div>
      </div>
    </article>
  </main>
</body>
</html>
