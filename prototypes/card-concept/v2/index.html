<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyberpunk Card v2</title>
  <style>
    :root {
      --card-w: min(82vw, 470px, calc((100vh - 88px) * 5 / 7.45));
      --radius: 24px;
      --glass: rgb(228 238 255 / 0.48);
      --glass-strong: rgb(245 249 255 / 0.82);
      --shadow: rgb(2 8 18 / 0.72);
      --ink: #070b12;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 34%, rgb(56 76 105) 0 16%, transparent 46%),
        radial-gradient(circle at 20% 82%, rgb(104 35 114 / 0.42), transparent 28%),
        linear-gradient(145deg, #04070d, #111927 50%, #05070c);
      font-family: "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif;
    }

    .stage {
      perspective: 1400px;
      padding: 34px;
    }

    .card {
      position: relative;
      width: var(--card-w);
      aspect-ratio: 5 / 7.45;
      border-radius: var(--radius);
      isolation: isolate;
      transform: rotateX(4deg) rotateY(-5deg);
      transform-style: preserve-3d;
      background: linear-gradient(145deg, rgb(255 255 255 / 0.66), rgb(190 205 230 / 0.34));
      box-shadow:
        0 44px 90px var(--shadow),
        0 0 34px rgb(196 222 255 / 0.44),
        inset 0 1px 0 rgb(255 255 255 / 0.95);
      transition: transform 420ms ease;
    }

    .card:hover {
      transform: rotateX(1deg) rotateY(4deg) translateY(-6px);
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    .card::before {
      z-index: 2;
      transform: translateZ(18px);
      background:
        linear-gradient(90deg, rgb(255 255 255 / 0.28), transparent 10% 90%, rgb(255 255 255 / 0.22)),
        linear-gradient(180deg, rgb(255 255 255 / 0.56), transparent 18% 82%, rgb(255 255 255 / 0.46));
      border: 1px solid rgb(255 255 255 / 0.72);
      box-shadow:
        inset 0 0 0 7px rgb(255 255 255 / 0.16),
        inset 0 0 0 12px rgb(118 154 205 / 0.12),
        inset 0 0 34px rgb(255 255 255 / 0.66);
    }

    .card::after {
      z-index: 9;
      transform: translateZ(42px);
      border: 2px solid rgb(255 255 255 / 0.76);
      box-shadow:
        inset 0 0 0 2px rgb(116 145 195 / 0.28),
        0 0 16px rgb(255 255 255 / 0.45);
      mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      padding: 8px;
    }

    .inner-plate {
      position: absolute;
      z-index: 3;
      inset: 12px 15px 18px;
      overflow: hidden;
      transform: translateZ(20px);
      border-radius: 16px 16px 16px 16px;
      background:
        linear-gradient(180deg, rgb(250 253 255 / 0.72), rgb(221 231 248 / 0.48) 19%, rgb(132 154 188 / 0.22)),
        linear-gradient(145deg, rgb(250 253 255 / 0.58), rgb(132 154 188 / 0.22));
      box-shadow:
        0 0 0 1px rgb(255 255 255 / 0.74),
        0 10px 24px rgb(3 7 15 / 0.22),
        inset 0 0 0 1px rgb(93 120 164 / 0.22),
        inset 0 0 24px rgb(255 255 255 / 0.38);
    }

    .inner-plate::before {
      content: "";
      position: absolute;
      inset: 4px;
      z-index: 2;
      pointer-events: none;
      border-radius: 12px;
      border: 1px solid rgb(255 255 255 / 0.7);
      box-shadow: inset 0 0 18px rgb(255 255 255 / 0.32);
    }

    .art {
      position: absolute;
      z-index: 1;
      left: 6px;
      right: 6px;
      top: 126px;
      bottom: 6px;
      overflow: hidden;
      border-radius: 3px 3px 12px 12px;
      background: url("card-art.png") center / cover no-repeat;
      box-shadow:
        0 0 0 1px rgb(255 255 255 / 0.36),
        inset 0 0 0 1px rgb(255 255 255 / 0.26),
        inset 0 0 40px rgb(1 5 12 / 0.74);
    }

    .art::before,
    .art::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .art::before {
      background:
        linear-gradient(90deg, rgb(255 255 255 / 0.18), transparent 18% 82%, rgb(255 255 255 / 0.16)),
        linear-gradient(180deg, transparent 62%, rgb(7 10 18 / 0.44));
      box-shadow: inset 0 0 38px rgb(0 0 0 / 0.42);
    }

    .art::after {
      width: 58%;
      height: 16%;
      left: 21%;
      top: 64%;
      border-radius: 10px;
      transform: skewX(-17deg);
      background:
        linear-gradient(180deg, transparent 18%, rgb(107 214 255 / 0.58) 19% 26%, transparent 27% 53%, rgb(52 144 255 / 0.48) 54% 68%, transparent 69%),
        linear-gradient(90deg, transparent, rgb(82 198 255 / 0.34), transparent);
      filter: blur(2px);
      opacity: 0.78;
    }

    .titlebar {
      position: absolute;
      z-index: 6;
      top: 0;
      left: 0;
      right: 0;
      height: 130px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 10px;
      transform: translateZ(24px);
      color: var(--ink);
      background:
        linear-gradient(180deg, var(--glass-strong), transparent 76%),
        linear-gradient(90deg, transparent, rgb(255 255 255 / 0.28), transparent);
      backdrop-filter: blur(12px);
      border-radius: 16px 16px 0 0;
      box-shadow: inset 0 -22px 30px rgb(122 143 178 / 0.12);
    }

    .titlebar::before {
      content: "";
      position: absolute;
      left: 38%;
      right: 38%;
      bottom: -1px;
      height: 20px;
      background: linear-gradient(180deg, rgb(232 238 250 / 0.88), rgb(146 155 177 / 0.48));
      clip-path: polygon(0 0, 100% 0, 82% 100%, 18% 100%);
      box-shadow: 0 1px 0 rgb(255 255 255 / 0.78);
    }

    .titlebar::after {
      content: "";
      position: relative;
      width: 38%;
      height: 1px;
      margin-top: 2px;
      background: linear-gradient(90deg, transparent, rgb(0 0 0 / 0.52), transparent);
    }

    .name {
      margin: 6px 0 0;
      font-size: 36px;
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 14px;
      text-indent: 14px;
    }

    .subtitle {
      margin: 0;
      font-size: 15px;
      letter-spacing: 8px;
      text-indent: 8px;
    }

    .sigil {
      width: 23px;
      height: 17px;
      display: block;
      margin-top: -3px;
      background:
        linear-gradient(135deg, transparent 0 43%, rgb(20 24 32 / 0.62) 44% 50%, transparent 51%) left / 50% 100% no-repeat,
        linear-gradient(45deg, transparent 0 43%, rgb(20 24 32 / 0.62) 44% 50%, transparent 51%) right / 50% 100% no-repeat;
      opacity: 0.72;
    }

    .stat {
      position: absolute;
      z-index: 7;
      top: 38px;
      width: 86px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      transform: translateZ(58px);
      clip-path: polygon(26% 0, 74% 0, 100% 26%, 100% 74%, 74% 100%, 26% 100%, 0 74%, 0 26%);
      color: #05080f;
      font-size: 58px;
      font-weight: 800;
      line-height: 1;
      background:
        linear-gradient(145deg, rgb(255 255 255 / 0.58), transparent 28%),
        linear-gradient(315deg, rgb(0 0 0 / 0.20), transparent 35%),
        var(--gem);
      box-shadow:
        0 0 0 1px rgb(255 255 255 / 0.72),
        0 0 22px var(--glow),
        inset 0 0 0 4px rgb(255 255 255 / 0.34),
        inset 0 0 18px var(--glow);
    }

    .stat::before,
    .stat::after {
      content: "";
      position: absolute;
      inset: 8px;
      clip-path: inherit;
      border: 2px solid rgb(255 255 255 / 0.76);
    }

    .stat::after {
      inset: 0;
      border-color: var(--glow);
      filter: blur(5px);
    }

    .stat-left {
      left: 33px;
      --gem: linear-gradient(145deg, #ffd1df, #e96ed1 48%, #7f43d0);
      --glow: rgb(255 114 200 / 0.7);
    }

    .stat-right {
      right: 33px;
      --gem: linear-gradient(145deg, #c8f4ff, #5fb8ff 48%, #3565d6);
      --glow: rgb(108 201 255 / 0.7);
    }

    .rail {
      position: absolute;
      z-index: 8;
      top: 278px;
      bottom: 220px;
      width: 18px;
      transform: translateZ(44px);
      opacity: 0.9;
    }

    .rail-left {
      left: 29px;
    }

    .rail-right {
      right: 29px;
    }

    .rail::before,
    .rail::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 96px;
      border-radius: 999px;
      background: linear-gradient(180deg, transparent, #fff 18% 82%, transparent);
      box-shadow: 0 0 12px rgb(255 255 255 / 0.78);
    }

    .rail::before {
      top: 0;
    }

    .rail::after {
      bottom: 0;
    }

    .rail-left::before,
    .rail-left::after {
      left: 0;
    }

    .rail-right::before,
    .rail-right::after {
      right: 0;
    }

    @media (max-width: 520px) {
      :root {
        --card-w: min(92vw, 390px, calc((100vh - 48px) * 5 / 7.45));
      }

      .stage {
        padding: 18px;
      }

      .name {
        font-size: 31px;
        letter-spacing: 10px;
        text-indent: 10px;
      }

      .subtitle {
        font-size: 12px;
        letter-spacing: 5px;
        text-indent: 5px;
      }

      .stat {
        width: 72px;
        font-size: 48px;
      }

      .stat-left {
        left: 24px;
      }

      .stat-right {
        right: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Cyberpunk card frame prototype">
    <article class="card">
      <div class="inner-plate">
        <header class="titlebar">
          <h1 class="name">LYRIA</h1>
          <p class="subtitle">SONIC SIREN</p>
          <span class="sigil" aria-hidden="true"></span>
        </header>
        <div class="art" aria-hidden="true"></div>
      </div>

      <div class="stat stat-left">5</div>
      <div class="stat stat-right">7</div>
      <div class="rail rail-left" aria-hidden="true"></div>
      <div class="rail rail-right" aria-hidden="true"></div>
    </article>
  </main>
</body>
</html>
